apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-upstream
  namespace: inference-gateway-mock
  labels:
    app: mock-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-upstream
  template:
    metadata:
      labels:
        app: mock-upstream
    spec:
      containers:
        - name: mock-upstream
          image: inference-gateway-mock-upstream:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
