apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: inference-gateway-mock
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: inference-serving-gateway:mock-kind
          imagePullPolicy: Never
          env:
            - name: GATEWAY_LISTEN_ADDR
              value: ":8080"
            - name: GATEWAY_UPSTREAM_BASE_URL
              value: "http://mock-upstream:18081"
            - name: GATEWAY_REQUEST_TIMEOUT
              value: "2s"
            - name: GATEWAY_ENABLE_METRICS
              value: "true"
            - name: GATEWAY_CONCURRENCY_LIMIT
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
